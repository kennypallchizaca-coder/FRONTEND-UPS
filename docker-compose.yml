# ---------------------------------------------------------------------------
# docker-compose.yml -- Orquestacion del Frontend (React + Nginx)
# ---------------------------------------------------------------------------

name: crm-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT_HOST:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
