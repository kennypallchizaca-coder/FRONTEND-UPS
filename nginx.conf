# Configuracion de Nginx para servir la SPA React (ComputacionCRM).
# Incluye: enrutamiento SPA, compresion gzip, cache de assets, headers de seguridad.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compresion gzip --------------------------------------------------- #
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --- Headers de seguridad ---------------------------------------------- #
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;

    # --- Cache de assets estaticos ----------------------------------------- #
    # Archivos con hash en el nombre (generados por Vite): cache agresivo.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Proxy inverso al backend Strapi ----------------------------------- #
    # Permite que el frontend consuma /api sin problemas de CORS en produccion.
    location /api/ {
        proxy_pass http://backend:1337/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy para los uploads de Strapi (imagenes subidas al CMS).
    location /uploads/ {
        proxy_pass http://backend:1337/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Enrutamiento SPA -------------------------------------------------- #
    # Todas las rutas que no correspondan a archivos fisicos redirigen a
    # index.html para que react-router-dom maneje la navegacion.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Deshabilitar acceso a archivos ocultos ----------------------------- #
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
