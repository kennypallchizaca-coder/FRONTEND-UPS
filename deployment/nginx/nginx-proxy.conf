# ---------------------------------------------------------------------------
# nginx-proxy.conf -- Proxy inverso Nginx con HTTPS (produccion)
# ---------------------------------------------------------------------------
# Esta configuracion se usa cuando se despliega en un servidor/VM con Nginx
# como proxy inverso frente a los contenedores Docker.
#
# Instalacion:
#   1. Copiar a /etc/nginx/sites-available/computacion-crm.conf
#   2. Crear enlace: ln -s /etc/nginx/sites-available/computacion-crm.conf /etc/nginx/sites-enabled/
#   3. Reemplazar tu-dominio.com con el dominio real.
#   4. Obtener certificados SSL: certbot --nginx -d tu-dominio.com
#   5. Recargar Nginx: systemctl reload nginx
# ---------------------------------------------------------------------------

# Redireccion HTTP a HTTPS
server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    server_name tu-dominio.com www.tu-dominio.com;

    # --- Certificados SSL (gestionados por Certbot) ----------------------- #
    ssl_certificate /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Headers de seguridad ---------------------------------------------- #
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;

    # --- Limites de cuerpo de solicitud ------------------------------------ #
    client_max_body_size 50M;

    # --- Proxy al frontend ------------------------------------------------- #
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Proxy al backend Strapi (panel de admin) -------------------------- #
    # Acceso directo al panel de admin de Strapi: https://tu-dominio.com/admin
    location /admin {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Acceso a archivos ocultos ----------------------------------------- #
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
